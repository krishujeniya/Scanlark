name: Flutter CI and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - uses: actions/upload-artifact@v5
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v5
        with:
          name: scanlark-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    needs: [quality, android-release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Read app version
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          version="${version%%+*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: scanlark-release-apk
          path: release-artifacts
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its published tag and assets unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-artifacts/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Scanlark $RELEASE_TAG" \
            --generate-notes
