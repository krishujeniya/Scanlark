allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    // Older Flutter plugins need namespace values from their Android manifests,
    // and some FlutterFire versions still declare BuildConfig fields. AGP 9
    // requires a namespace and disables BuildConfig for libraries by default.
    plugins.withId('com.android.library') {
        android {
            if (namespace == null) {
                def manifestFile = project.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def packageMatcher = manifestFile.getText('UTF-8') =~ /package=["']([^"']+)["']/
                    if (packageMatcher.find()) {
                        namespace = packageMatcher.group(1)
                    }
                }
            }
            buildFeatures {
                buildConfig = true
            }
        }
        androidComponents {
            finalizeDsl { androidDsl ->
                // Legacy plugins hard-code API 31 despite AndroidX requiring 34+.
                androidDsl.compileSdk = 36
            }
        }
    }

    if (name == 'image_picker_android') {
        // AGP 9.3 lint crashes in JavaDocParser on this upstream plugin source.
        tasks.configureEach {
            if (name == 'lintVitalAnalyzeRelease') {
                enabled = false
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
